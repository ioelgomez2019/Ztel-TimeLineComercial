<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrador | Calendario ZTEL-Spa</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ══════════════ LOGIN ══════════════ -->
  <div id="screen-login">
    <div class="login-card">
      <div class="login-logo">📅</div>
      <div class="login-brand">Calendario Comercial <span>ZTEL-Spa</span></div>
      <p class="login-sub">Panel de Administración</p>
      <form id="form-login" novalidate>
        <div class="login-field">
          <label for="l-user">Usuario</label>
          <input type="text" id="l-user" placeholder="Ingresa tu usuario" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="l-pass">Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="pass-eye" id="pass-eye" tabindex="-1" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <div class="login-error" id="login-error" role="alert"></div>
        <button type="submit" class="btn-login" id="btn-login-submit">Ingresar →</button>
      </form>
    </div>
  </div>

  <!-- ══════════════ DASHBOARD ══════════════ -->
  <div id="dashboard" class="hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">📅</span>
        <div>
          <div class="sidebar-title">ZTEL-Spa</div>
          <div class="sidebar-sub">Administración</div>
        </div>
      </div>

      <div class="sidebar-user" id="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-meta">
          <div class="user-name"  id="user-name">Admin</div>
          <div class="user-badge" id="user-badge">Superadmin</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="nav-link" data-section="eventos" href="#">
          <span>📋</span> Eventos
        </a>
        <a class="nav-link" data-section="usuarios" href="#" id="nav-usuarios">
          <span>👥</span> Usuarios
        </a>
      </nav>

      <div class="sidebar-footer">
        <a class="nav-link nav-ext" href="../index.html" target="_blank">
          <span>🌐</span> Ver calendario
        </a>
        <button class="nav-link nav-logout" id="btn-logout">
          <span>🚪</span> Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- overlay mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ÁREA PRINCIPAL -->
    <div class="admin-wrap">
      <div class="topbar">
        <button class="topbar-toggle" id="topbar-toggle" aria-label="Menú">☰</button>
        <span class="topbar-title" id="topbar-title">Eventos</span>
        <div class="topbar-right" id="topbar-right"></div>
      </div>
      <main class="content-area" id="content-area"></main>
    </div>

  </div>

  <!-- ══════════════ MODAL CRUD ══════════════ -->
  <div class="modal-overlay" id="modal-main" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
      <div id="modal-inner"></div>
    </div>
  </div>

  <!-- ══════════════ CONFIRM ══════════════ -->
  <div class="modal-overlay" id="modal-confirm" aria-hidden="true" role="alertdialog">
    <div class="modal-box confirm-box">
      <div class="confirm-icon" id="confirm-icon">🗑️</div>
      <h3 id="confirm-title">¿Confirmar?</h3>
      <p  id="confirm-msg"></p>
      <div class="confirm-btns">
        <button class="btn-secondary" id="confirm-no">Cancelar</button>
        <button class="btn-danger"    id="confirm-yes">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <script src="admin.js"></script>
</body>
</html>
